RUN | atm_mpasmodel                                | + ursa hercules wcoss2 gaeac6 |          |
RUN | atm_mpasmodel_mpi                            | + ursa hercules wcoss2 gaeac6 |          |
RUN | atm_mpasmodel_2threads                       | + ursa hercules wcoss2 gaeac6 |          |

RUN | atm_mpasmodel_conus                          | + ursa hercules wcoss2 gaeac6 | baseline |
