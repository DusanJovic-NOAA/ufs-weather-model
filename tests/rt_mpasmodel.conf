### UFS with MPASMODEL ###

COMPILE | atm_mpasmodel       | gnu   | -DAPP=MPASMODEL -D32BIT=ON  -DDEBUG=OFF | + ursa hercules | fv3 |
RUN | atm_mpasmodel_quilt                          | + ursa hercules | baseline |
RUN | atm_mpasmodel_quilt_restart                  | + ursa hercules |          | atm_mpasmodel_quilt
RUN | atm_mpasmodel_quilt_mpi                      | + ursa hercules |          |
RUN | atm_mpasmodel_quilt_2threads                 | + ursa hercules |          |
RUN | atm_mpasmodel                                | + ursa hercules |          |
RUN | atm_mpasmodel_mpi                            | + ursa hercules |          |
RUN | atm_mpasmodel_2threads                       | + ursa hercules |          |
RUN | atm_mpasmodel_40962_quilt                    | + ursa hercules | baseline |
RUN | atm_mpasmodel_40962_quilt_restart            | + ursa hercules |          | atm_mpasmodel_40962_quilt

RUN | atm_mpasmodel_conus                          | + ursa hercules | baseline |
RUN | atm_mpasmodel_conus_restart                  | + ursa hercules |          | atm_mpasmodel_conus

COMPILE | atm_mpasmodel_64bit | gnu   | -DAPP=MPASMODEL -D32BIT=OFF -DDEBUG=OFF | + ursa hercules | fv3 |
RUN | atm_mpasmodel_64bit_quilt                    | + ursa hercules | baseline |
RUN | atm_mpasmodel_64bit_quilt_restart            | + ursa hercules |          | atm_mpasmodel_64bit_quilt
RUN | atm_mpasmodel_64bit                          | + ursa hercules |          |

RUN | atm_mpasmodel_64bit_conus                    | + ursa hercules | baseline |
RUN | atm_mpasmodel_64bit_conus_restart            | + ursa hercules |          | atm_mpasmodel_64bit_conus

COMPILE | atm_mpasmodel_debug | gnu   | -DAPP=MPASMODEL -D32BIT=ON  -DDEBUG=ON  | + ursa hercules | fv3 |
RUN | atm_mpasmodel_quilt_debug                    | + ursa hercules | baseline |
RUN | atm_mpasmodel_quilt_restart_debug            | + ursa hercules |          | atm_mpasmodel_quilt_debug
RUN | atm_mpasmodel_debug                          | + ursa hercules |          |
RUN | atm_mpasmodel_mpi_debug                      | + ursa hercules |          |

RUN | atm_mpasmodel_conus_debug                    | + ursa hercules | baseline |
RUN | atm_mpasmodel_conus_restart_debug            | + ursa hercules |          | atm_mpasmodel_conus_debug

COMPILE | atm_mpasmodel_64bit_debug | gnu   | -DAPP=MPASMODEL -D32BIT=OFF -DDEBUG=ON  | + ursa hercules | fv3 |
RUN | atm_mpasmodel_64bit_quilt_debug              | + ursa hercules | baseline |
RUN | atm_mpasmodel_64bit_quilt_restart_debug      | + ursa hercules |          | atm_mpasmodel_64bit_quilt_debug
RUN | atm_mpasmodel_64bit_debug                    | + ursa hercules |          |
RUN | atm_mpasmodel_64bit_mpi_debug                | + ursa hercules |          |


# Release (non-debug) build with default FASTER=ON does not reproduce mpi against control. Turning FASTER=OFF
COMPILE | atm_mpasmodel       | intel | -DAPP=MPASMODEL -D32BIT=ON  -DDEBUG=OFF -DFASTER=OFF | + ursa hercules wcoss2 gaeac6 | fv3 |
RUN | atm_mpasmodel_quilt                          | + ursa hercules wcoss2 gaeac6 | baseline |
RUN | atm_mpasmodel_quilt_restart                  | + ursa hercules wcoss2 gaeac6 |          | atm_mpasmodel_quilt
