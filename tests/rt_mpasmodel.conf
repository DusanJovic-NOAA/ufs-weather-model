### UFS with MPASMODEL ###

COMPILE | atm_mpasmodel       | gnu   | -DAPP=MPASMODEL -D32BIT=ON  -DDEBUG=OFF | + ursa | fv3 |
RUN | atm_mpasmodel_quilt                          | + ursa | baseline |
RUN | atm_mpasmodel_quilt_restart                  | + ursa |          | atm_mpasmodel_quilt
RUN | atm_mpasmodel_quilt_mpi                      | + ursa |          |
RUN | atm_mpasmodel_quilt_2threads                 | + ursa |          |
RUN | atm_mpasmodel                                | + ursa |          |
RUN | atm_mpasmodel_mpi                            | + ursa |          |
RUN | atm_mpasmodel_2threads                       | + ursa |          |

RUN | atm_mpasmodel_conus                          | + ursa | baseline |
RUN | atm_mpasmodel_conus_restart                  | + ursa |          | atm_mpasmodel_conus

COMPILE | atm_mpasmodel_64bit | gnu   | -DAPP=MPASMODEL -D32BIT=OFF -DDEBUG=OFF | + ursa | fv3 |
RUN | atm_mpasmodel_64bit_quilt                    | + ursa | baseline |
RUN | atm_mpasmodel_64bit_quilt_restart            | + ursa |          | atm_mpasmodel_64bit_quilt
RUN | atm_mpasmodel_64bit                          | + ursa |          |

RUN | atm_mpasmodel_64bit_conus                    | + ursa | baseline |
RUN | atm_mpasmodel_64bit_conus_restart            | + ursa |          | atm_mpasmodel_64bit_conus

COMPILE | atm_mpasmodel_debug | gnu   | -DAPP=MPASMODEL -D32BIT=ON  -DDEBUG=ON  | + ursa | fv3 |
RUN | atm_mpasmodel_quilt_debug                    | + ursa | baseline |
RUN | atm_mpasmodel_quilt_restart_debug            | + ursa |          | atm_mpasmodel_quilt_debug
RUN | atm_mpasmodel_debug                          | + ursa |          |
RUN | atm_mpasmodel_mpi_debug                      | + ursa |          |

RUN | atm_mpasmodel_conus_debug                    | + ursa | baseline |
RUN | atm_mpasmodel_conus_restart_debug            | + ursa |          | atm_mpasmodel_conus_debug

COMPILE | atm_mpasmodel_64bit_debug | gnu   | -DAPP=MPASMODEL -D32BIT=OFF -DDEBUG=ON  | + ursa | fv3 |
RUN | atm_mpasmodel_64bit_quilt_debug              | + ursa | baseline |
RUN | atm_mpasmodel_64bit_quilt_restart_debug      | + ursa |          | atm_mpasmodel_64bit_quilt_debug
RUN | atm_mpasmodel_64bit_debug                    | + ursa |          |
RUN | atm_mpasmodel_64bit_mpi_debug                | + ursa |          |


# Release (non-debug) build with default FATSER=ON does not reproduce mpi against control. Turning FASTER=OFF
COMPILE | atm_mpasmodel       | intel | -DAPP=MPASMODEL -D32BIT=ON  -DDEBUG=OFF -DFASTER=OFF | + ursa wcoss2 | fv3 |
RUN | atm_mpasmodel_quilt                          | + ursa wcoss2 | baseline |
RUN | atm_mpasmodel_quilt_restart                  | + ursa wcoss2 |          | atm_mpasmodel_quilt
RUN | atm_mpasmodel_quilt_mpi                      | + ursa wcoss2 |          |
RUN | atm_mpasmodel_quilt_2threads                 | + ursa wcoss2 |          |
RUN | atm_mpasmodel                                | + ursa wcoss2 |          |
RUN | atm_mpasmodel_mpi                            | + ursa wcoss2 |          |
RUN | atm_mpasmodel_2threads                       | + ursa wcoss2 |          |

RUN | atm_mpasmodel_conus                          | + ursa wcoss2 | baseline |
RUN | atm_mpasmodel_conus_restart                  | + ursa wcoss2 |          | atm_mpasmodel_conus

COMPILE | atm_mpasmodel_64bit | intel | -DAPP=MPASMODEL -D32BIT=OFF -DDEBUG=OFF -DFASTER=OFF | + ursa wcoss2 | fv3 |
RUN | atm_mpasmodel_64bit_quilt                    | + ursa wcoss2 | baseline |
RUN | atm_mpasmodel_64bit_quilt_restart            | + ursa wcoss2 |          | atm_mpasmodel_64bit_quilt
RUN | atm_mpasmodel_64bit                          | + ursa wcoss2 |          |

RUN | atm_mpasmodel_64bit_conus                    | + ursa wcoss2 | baseline |
RUN | atm_mpasmodel_64bit_conus_restart            | + ursa wcoss2 |          | atm_mpasmodel_64bit_conus

COMPILE | atm_mpasmodel_debug | intel | -DAPP=MPASMODEL -D32BIT=ON  -DDEBUG=ON  | + ursa wcoss2 | fv3 |
RUN | atm_mpasmodel_quilt_debug                    | + ursa wcoss2 | baseline |
RUN | atm_mpasmodel_quilt_restart_debug            | + ursa wcoss2 |          | atm_mpasmodel_quilt_debug
RUN | atm_mpasmodel_debug                          | + ursa wcoss2 |          |
RUN | atm_mpasmodel_mpi_debug                      | + ursa wcoss2 |          |

RUN | atm_mpasmodel_conus_debug                    | + ursa wcoss2 | baseline |
RUN | atm_mpasmodel_conus_restart_debug            | + ursa wcoss2 |          | atm_mpasmodel_conus_debug

COMPILE | atm_mpasmodel_64bit_debug | intel | -DAPP=MPASMODEL -D32BIT=OFF -DDEBUG=ON  | + ursa wcoss2 | fv3 |
RUN | atm_mpasmodel_64bit_quilt_debug              | + ursa wcoss2 | baseline |
RUN | atm_mpasmodel_64bit_quilt_restart_debug      | + ursa wcoss2 |          | atm_mpasmodel_64bit_quilt_debug
RUN | atm_mpasmodel_64bit_debug                    | + ursa wcoss2 |          |
RUN | atm_mpasmodel_64bit_mpi_debug                | + ursa wcoss2 |          |
