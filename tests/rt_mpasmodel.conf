### UFS with MPASMODEL ###
COMPILE | atm_mpasmodel | gnu | -DAPP=MPASMODEL -D32BIT=ON -DDEBUG=OFF | + ursa | fv3 |
RUN | atm_mpasmodel                                | + ursa | baseline |
RUN | atm_mpasmodel_quilt                          | + ursa |          |

RUN | atm_mpasmodel_conus                          | + ursa | baseline |

COMPILE | atm_mpasmodel_64bit | gnu | -DAPP=MPASMODEL -D32BIT=OFF  -DDEBUG=OFF | + ursa | fv3 |
RUN | atm_mpasmodel_64bit                          | + ursa | baseline |
RUN | atm_mpasmodel_64bit_quilt                    | + ursa |          |

RUN | atm_mpasmodel_64bit_conus                    | + ursa | baseline |

COMPILE | atm_mpasmodel_debug | gnu | -DAPP=MPASMODEL -D32BIT=ON -DDEBUG=ON  | + ursa | fv3 |
RUN | atm_mpasmodel_debug                          | + ursa | baseline |
RUN | atm_mpasmodel_quilt_debug                    | + ursa |          |

RUN | atm_mpasmodel_conus_debug                    | + ursa | baseline |

COMPILE | atm_mpasmodel | intel | -DAPP=MPASMODEL -D32BIT=ON -DDEBUG=OFF | + ursa | fv3 |
RUN | atm_mpasmodel                                | + ursa | baseline |
RUN | atm_mpasmodel_quilt                          | + ursa |          |

RUN | atm_mpasmodel_conus                          | + ursa | baseline |
